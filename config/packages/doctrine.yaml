doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # Configurez la version du serveur si nécessaire
        # server_version: '14'

    orm:
        auto_generate_proxy_classes: true
        # Mode moderne des proxys Doctrine (defaut a partir de doctrine-bundle 3).
        # Poser la valeur eteint la depreciation au demarrage.
        enable_lazy_ghost_objects: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        # auto_mapping DOIT rester a false des lors qu'on declare des mappings
        # explicites. Avec les deux actifs en meme temps, DoctrineBundle peut
        # enregistrer le meme jeu d'entites sous deux noms de mapping
        # differents : chaque entite est alors chargee deux fois, et la
        # construction du schema echoue sur la premiere collision de table
        # rencontree (ici ext_translations).
        auto_mapping: false
        mappings:
            App:
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                type: annotation
                prefix: 'App\Entity'
                alias: App
            GedmoTranslatable:
                is_bundle: false
                dir: '%kernel.project_dir%/vendor/gedmo/doctrine-extensions/src/Translatable/Entity'
                type: annotation
                prefix: 'Gedmo\Translatable\Entity'
                alias: GedmoTranslatable

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" est généralement défini par ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
