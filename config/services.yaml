# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

parameters:
    images_directory: "%kernel.project_dir%/public/image_project"
    subject_directory: "%kernel.project_dir%/public/uploads/subject/image"
    message_directory: "%kernel.project_dir%/public/uploads/message/image"
    uploads_directory: "%kernel.project_dir%/public/uploads/avatar"
    media_directory: '%kernel.project_dir%/public/uploads/media'
    prospects_directory: '%kernel.project_dir%/public/uploads/prospects'
    api_resource_token: "%env(API_RESOURCE_TOKEN)%"
    api_resource_url: "%env(API_RESOURCE_URL)%"
    # Plateforme partenaire vers laquelle sont relayees les demandes
    # qui sortent du perimetre ou des disponibilites.
    axishumain_url: '%env(AXISHUMAIN_URL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $projectDir: '%kernel.project_dir%'

    Gedmo\Translatable\TranslatableListener:
        tags:
            - { name: doctrine.event_subscriber, connection: default }
        calls:
            - [ setDefaultLocale, ["%kernel.default_locale%"] ]
            - [ setTranslationFallback, [true] ]

    App\Controller\Front\LocaleController:
        public: true
        autowire: true
        autoconfigure: true
        tags: ['controller.service_arguments']

    App\Controller\ExceptionController:
        arguments:
            - "@twig"
        tags:
            - { name: "controller.service_arguments" }

    App\Controller\Front\MessageController:
        tags: ['controller.service_arguments']

    App\Security\Voter\DevisVoter:
        tags:
            - { name: 'security.voter' }

    App\Twig\AppExtension:
        tags: ['twig.extension']

    App\Twig\CspExtension:
        tags: ['twig.extension']

    # Compteurs de l'administration, calcules une fois par requete.
    App\Twig\AdminExtension:
        tags: ['twig.extension']

    # En-têtes de sécurité HTTP et politique de sécurité du contenu.
    # Les deux interrupteurs se pilotent depuis .env :
    #   CSP_ENFORCE=0 -> mode observation (Report-Only), rien n'est bloqué
    #   CSP_ENFORCE=1 -> mode bloquant
    #   CSP_STRICT=1  -> supprime 'unsafe-inline' (exige csp_nonce() partout)
    App\EventSubscriber\SecurityHeadersSubscriber:
        arguments:
            $cspEnforce: '%env(bool:CSP_ENFORCE)%'
            $cspStrict: '%env(bool:CSP_STRICT)%'
            $environment: '%kernel.environment%'
            $reportUri: '%env(string:CSP_REPORT_URI)%'

    App\:
        resource: "../src/"
        exclude:
            - "../src/DependencyInjection/"
            - "../src/Entity/"
            - "../src/Kernel.php"
