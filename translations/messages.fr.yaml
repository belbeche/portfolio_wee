referral.how_title: "Comment ça se passe"
referral.lead: "Je développe des applications mobiles React Native et des back-ends Symfony. Tout ne rentre pas dans ce cadre, et mon planning n'est pas extensible. Plutôt que de vous dire non, j'ai construit"
referral.lead_end: ": une place de marché qui met en relation les entreprises avec des experts IT indépendants."
