quote.badge3: "Suivi en ligne de la demande"
quote.card1_p: "C'est normal, et ce n'est pas votre métier. Décrivez le problème que vous voulez régler, pas la solution technique. Je m'occupe de traduire."
quote.card1_title: "Vous ne savez pas quoi demander ?"
