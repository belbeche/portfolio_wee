# Formulaire de devis
quote.desc_help: "Le problème plutôt que la solution technique. C'est mon métier de traduire."
quote.desc_label: "Parlez-moi de votre projet"
quote.desc_ph: "Que voulez-vous régler ? Pour qui ? Avez-vous une échéance ? Un budget en tête ? Ce que vous utilisez aujourd'hui ?"
quote.design_help: "Plusieurs choix possibles. Si aucun ne vous parle, passez à la suite : on en discutera de vive voix."
quote.email_help: "Elle sert uniquement à vous envoyer le devis. Aucune inscription à une liste."
quote.email_label: "Votre adresse e-mail"
quote.form_lead: "Quatre questions. Répondez avec vos mots, pas avec du vocabulaire technique."
quote.form_title: "Décrivez votre projet"
quote.prefer_talk: "Vous préférez en parler de vive voix ?"
quote.sent_to: "Le devis partira sur"
quote.step1: "1 · Où vous envoyer le devis"
quote.step2: "2 · Ce que vous voulez faire construire"
quote.step3: "3 · Vos attentes sur le design"
quote.step4: "4 · Le contexte, en quelques lignes"
quote.submit: "Recevoir mon devis détaillé"
quote.submit_note: "Réponse sous 48 h ouvrées · aucune relance commerciale"
quote.type_help: "Je ne sais pas lequel choisir"
quote.type_label: "Type d'application souhaité"
quote.write_me: "Écrivez-moi"
home.pil_1_label: "Je chiffre ce qui sert, pas ce qui brille"
home.pil_1_p1: "Avant de chiffrer, je demande à quoi le résultat doit servir : convaincre un financeur, tenir une charge, être repris par une autre équipe. Un livrable spectaculaire qui ne sert pas cet objectif est une dépense, pas un investissement."
home.pil_1_p2: "C'est pour ça que mes devis détaillent chaque poste : vous voyez ce qui produit de la valeur, et ce que vous pouvez retirer."
home.pil_2_label: "Mes erreurs, je les écris"
home.pil_2_p1: "Quand un défaut vient de mon travail, vous le lisez dans mon compte rendu, nommé et daté, avec la correction à la racine, sans frais. Pas d'euphémisme, pas de silence."
home.pil_2_p2: "Un prestataire qui n'a jamais de bug est un prestataire qui ne vous les raconte pas."
home.pil_3_label: "Je sais dire non à une ligne de facturation"
home.pil_3_p1: "Quand une demande dessert votre projet, juridiquement ou techniquement, je vous le déconseille par écrit, même si c'était une belle ligne de facturation pour moi."
home.pil_3_p2: "Un projet qui veut tout faire finit par ne rien faire de fiable."
home.skills_note: "Et si vous voulez une preuve : demandez-moi, pour n'importe quelle ligne, le projet en production où elle a servi."
