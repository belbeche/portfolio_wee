method.lead: "La plupart des projets n'échouent pas sur la technique. Ils échouent parce que personne n'a écrit ce qui devait être construit, et que plus rien ne permet de trancher quand un désaccord arrive. Voici ce que je mets en place pour que ça n'arrive pas."
