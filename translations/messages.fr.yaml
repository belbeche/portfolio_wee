offer.why_eyebrow: "Pourquoi cette troisième formule"
offer.why_p1: "Une TPE ou une association n'a pas les moyens d'un responsable informatique, et n'en a pas besoin à plein temps. Elle a besoin de quelqu'un qui connaît son dossier et qui répond."
offer.why_p2: "Aujourd'hui, quand votre site tombe, vous cherchez dans vos e-mails qui l'a fait, vous découvrez que l'agence a fermé, et vous appelez votre neveu. Avec cette formule, vous appelez un numéro et quelqu'un qui connaît déjà votre installation décroche."
offer.why_title_1: "Ce n'est pas de la maintenance."
offer.why_title_2: "C'est une direction technique."

