referral.app_cta1: "Voir la plateforme"
referral.app_cta2: "Mes autres réalisations"
referral.app_p1: "AxisHumain n'est pas un carnet d'adresses que j'aurais rassemblé. C'est une application complète, conçue, développée et mise en production seul sous Symfony 6.4."
referral.app_p2: "Je le précise pour une raison simple : c'est aussi la meilleure démonstration de ce que je sais faire. Une place de marché, c'est deux parcours utilisateurs opposés à réconcilier, un moteur de mise en correspondance, des paiements en ligne, un système d'avis, un fil d'actualité et une modération. Si vous vous demandiez ce que je suis capable de construire, la réponse est en ligne et vous pouvez la tester."
referral.app_title: "Une application, pas un annuaire"
referral.eyebrow: "Je ne vous laisse jamais sans réponse"
referral.final_title: "Prêt à publier votre mission ?"
