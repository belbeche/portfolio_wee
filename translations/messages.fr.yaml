quote.card2_title: "Un devis, pas une fourchette"
quote.card3_p: "Vous recevez votre devis, et c'est tout. Si vous ne donnez pas suite, vous n'entendrez plus parler de moi."
quote.card3_title: "Aucune relance commerciale"
