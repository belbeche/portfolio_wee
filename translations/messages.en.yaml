referral.app_p2: "I say so for a simple reason: it is also the best demonstration of what I can build. A marketplace means two opposing user journeys to reconcile, a matching engine, online payments, a review system, an activity feed and moderation. If you were wondering what I am capable of building, the answer is online and you can test it."
