# Formulaire de devis
quote.desc_help: "The problem rather than the technical solution. Translating is my job."
quote.desc_label: "Tell me about your project"
quote.desc_ph: "What do you want to solve? For whom? Do you have a deadline? A budget in mind? What are you using today?"
quote.design_help: "Several choices possible. If none speaks to you, move on: we will discuss it in person."
quote.email_help: "It is used only to send you the quote. You are not signed up to any list."
quote.email_label: "Your email address"
quote.form_lead: "Four questions. Answer in your own words, not in technical jargon."
quote.form_title: "Describe your project"
quote.prefer_talk: "Would you rather talk it through?"
quote.sent_to: "The quote will be sent to"
