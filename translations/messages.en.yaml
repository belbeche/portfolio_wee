quote.submit_note: "Answer within 48 working hours · no sales follow-up"
quote.type_help: "I'm not sure which one to pick"
quote.type_label: "Type of application"
quote.write_me: "Write to me"
home.pil_1_label: "I price what serves you, not what shines"
home.pil_1_p1: "Before quoting, I ask what the result must achieve: convince a funder, hold a load, be taken over by another team. An impressive deliverable that misses that goal is an expense, not an investment."
home.pil_1_p2: "That is why my quotes itemise every line: you see what creates value, and what you can drop."
home.pil_2_label: "My mistakes go in writing"
home.pil_2_p1: "When a defect comes from my work, you read it in my report, named and dated, fixed at the root, at no charge. No euphemism, no silence."
home.pil_2_p2: "A contractor who never has bugs is a contractor who never tells you about them."
home.pil_3_label: "I can turn down a billable line"
home.pil_3_p1: "When a request works against your project, legally or technically, I advise against it in writing, even when it would have been good billing for me."
home.pil_3_p2: "A project that tries to do everything ends up doing nothing reliably."
home.skills_note: "And if you want proof: ask me, for any line here, which live project it served on."
