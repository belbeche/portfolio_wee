<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12233d"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#fond)"/>

  <!-- Chevrons de code, rappel du logotype </Walid BELBECHE> -->
  <g stroke="#f5b301" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="126,198 84,252 126,306"/>
    <polyline points="386,198 428,252 386,306"/>
  </g>

  <!-- Monogramme WB -->
  <text x="256" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="116"
        font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central"
        letter-spacing="2">WB</text>

  <!-- Filet dore sous le monogramme -->
  <rect x="211" y="342" width="90" height="11" rx="5.5" fill="#f5b301"/>
</svg>
